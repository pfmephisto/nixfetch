[tool.poetry]
name = "nixfetch"
version = "0.1.0"
description = "A fastfetch-like tool for Nix flakes that generates beautiful documentation"
authors = ["Povl Filip Sonne-Frederiksen"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
rich = "^13.0.0"
pillow = { version = "~10.0", optional = true }

[tool.poetry.extras]
images = ["pillow"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "nixfetch"
dynamic = ["version"]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "rich>=13.0.0",
]
optional-dependencies = { images = ["pillow~=10.0"] }
keywords = ["nix", "flake", "stats", "documentation", "readme"]
authors = [
  {name = "Povl Filip Sonne-Frederiksen"}
]

[project.scripts]
nixfetch = "nixfetch:run"

[project.urls]
source = "https://github.com/pfmephisto/nixfetch"
